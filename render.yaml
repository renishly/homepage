# Render Blueprint: tells Render what to create when you click "New > Blueprint".
# Reference: https://render.com/docs/blueprint-spec
#
# The database is NOT on Render: it's a Postgres database hosted elsewhere
# (currently Supabase's free plan, which doesn't expire). Render only runs the
# website, and you give it the database's address as DATABASE_URL.
services:
  - type: web
    name: homepage
    runtime: python
    plan: free  # sleeps when idle; first visit after a while is slow
    buildCommand: pip install -r requirements.txt
    startCommand: fastapi run main.py --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      # sync: false = Render asks you to type these in (or set them under the
      # service's Environment tab). They are never stored in this file or in GitHub.
      # DATABASE_URL: the Postgres connection string, e.g. Supabase's
      # "Session pooler" string (IPv4), ending in ?sslmode=require.
      - key: DATABASE_URL
        sync: false
      - key: DASHBOARD_USER
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: AGENT_EDIT_PASSWORD  # needed to delete an agent or view/replace its key
        sync: false
      - key: KEY_ENCRYPTION_SECRET  # encrypts agents' API keys in the database
        sync: false
