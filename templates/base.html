<!doctype html>
<html lang="en" data-theme="codepaper">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Homepage{% endblock %}</title>
  <meta name="theme-color" content="#ffff83">

  <!-- IBM Plex Mono, the "code" look used for everything, served by this site
       (static/fonts/, declared in theme.css). The two weights used most are
       fetched straight away, so text appears in the right font sooner. -->
  <link rel="preload" href="/static/fonts/ibm-plex-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/ibm-plex-mono-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Tailwind CSS and daisyUI: the styles for class names like "grid-cols-3",
       "btn" or "card", built ahead of time from the templates with only the
       parts the site uses (see tailwind.input.css). -->
  <link href="{{ static_url('tailwind.css') }}" rel="stylesheet" type="text/css">
  <!-- The site's look: the "codepaper" colour theme, borders, shadows and animations.
       Loaded after daisyUI so it can adjust daisyUI's components. -->
  <link href="{{ static_url('theme.css') }}" rel="stylesheet" type="text/css">
  <!-- Hides elements marked x-cloak until Alpine.js has loaded (no flash of hidden forms). -->
  <style>[x-cloak] { display: none !important; }</style>

  <!-- HTMX 2.0.11: lets HTML attributes like hx-post fetch and swap content from the server.
       Alpine.js 3.17.4: small interactions (like hiding an alert) written as HTML attributes.
       Both are served by this site (static/vendor/), so pages don't wait on other servers. -->
  <script src="{{ static_url('vendor/htmx-2.0.11.min.js') }}"></script>
  <script defer src="{{ static_url('vendor/alpine-3.17.4.min.js') }}"></script>
</head>
{# Pages behind the login fill body_attrs with the CSRF token header, so every
   HTMX request from them carries it. The public home page leaves it empty. #}
<body class="min-h-screen bg-base-200 font-sans antialiased" {% block body_attrs %}{% endblock %}>
  {% block content %}{% endblock %}

  <!-- Pop-up messages ("Sent start to agent-1") appear here, bottom-right. -->
  {# max-lg:mb-24 lifts pop-ups above the agent page's Controls bar on phones. #}
  <div id="toasts" class="toast toast-end z-50 max-lg:mb-24" aria-live="polite"></div>

  <!-- The background grid's rush on each page, carrying on from the previous page. -->
  <script src="{{ static_url('grid.js') }}"></script>
</body>
</html>
